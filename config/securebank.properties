! SecureBank settings.
!
! This file holds ONLY non-secret settings. SecureBank refuses to start if it finds anything
! that looks like a password, key, or token here (CWE-260); secrets come from the environment.
! Every value has a safe built-in default and a safe allowed range (CWE-1188), and unknown
! settings are rejected (CWE-15). Two-factor sign-in and TLS are always on and can't be changed.

! Sessions end after this many minutes (allowed: 5 to 30).
session.timeoutMinutes=15

! Sign-in is locked after this many failures in a row for one user (allowed: 3 to 10).
auth.maxFailedLoginsPerAccount=5

! A network address is blocked after this many failures (allowed: 3 to 50)...
auth.maxFailedLoginsPerAddress=3
! ...for this many minutes (allowed: 5 to 1440).
auth.addressBlockMinutes=30

! Largest cash withdrawal a teller can make without a manager's approval (allowed: 100 to 10000).
teller.cashLimitDollars=5000

! Month-end rules.
savings.monthlyInterestBasisPoints=25
checking.minimumBalanceDollars=500
checking.monthlyFeeCents=500
